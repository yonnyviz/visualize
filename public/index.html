<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>/visualize Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    // Initialize Mermaid with dynamic theme support
    function getMermaidTheme() {
      const theme = document.documentElement.getAttribute('data-theme') || 'light';
      return theme === 'dark' ? 'dark' : 'default';
    }

    function getMermaidThemeVariables() {
      const theme = document.documentElement.getAttribute('data-theme') || 'light';
      if (theme === 'dark') {
        // Dark-academic theme: espresso browns, aged gold, muted parchment
        return {
          primaryColor: '#2a2420',
          primaryBorderColor: '#4a4038',
          primaryTextColor: '#e8dfd0',
          lineColor: '#8a7a5c',
          secondaryColor: '#332a22',
          tertiaryColor: '#241f1a',
          background: '#1c1712',
          fontFamily: '"Source Serif 4", Georgia, serif',
          fontSize: '14px'
        };
      } else {
        // Light-academic theme: aged paper, ink, oxford blue
        return {
          primaryColor: '#f7f1e3',
          primaryBorderColor: '#c9b896',
          primaryTextColor: '#2b2517',
          lineColor: '#8a7550',
          secondaryColor: '#eee3cb',
          tertiaryColor: '#f3ead6',
          background: '#fdfaf3',
          fontFamily: '"Source Serif 4", Georgia, serif',
          fontSize: '14px'
        };
      }
    }

    if (typeof mermaid !== 'undefined') {
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        theme: getMermaidTheme(),
        themeVariables: getMermaidThemeVariables()
      });
    }
  </script>
  <style>
    :root {
      /* Light theme — aged paper / scholastic */
      --bg-primary: #fdfaf3;
      --bg-secondary: #f8f2e4;
      --bg-tertiary: #f1e8d3;
      --text-primary: #2b2517;
      --text-secondary: #57503f;
      --text-tertiary: #948a72;
      --border-color: #cdbd97;
      --border-light: #e2d5b3;
      --accent: #6e2c2c;
      --accent-soft: #8a4a4a;
      --accent-gold: #a5772d;
      --accent-error: #a5772d;
      --accent-error-bg: #f5e8cd;
      --accent-error-text: #6b4a15;
      --card-shadow: rgba(74, 58, 20, 0.14);
      --divider: #d7c7a0;
      --mermaid-bg: #fdfaf3;
      --rule: #6e2c2c;
      --serif-display: "Playfair Display", Georgia, serif;
      --serif-body: "Source Serif 4", Georgia, serif;
      --mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
    }

    html[data-theme="dark"] {
      /* Dark theme — old library / candlelight */
      --bg-primary: #1c1712;
      --bg-secondary: #241e17;
      --bg-tertiary: #2c241b;
      --text-primary: #ecdfc4;
      --text-secondary: #bfae8c;
      --text-tertiary: #8a7a5c;
      --border-color: #4a3f2e;
      --border-light: #362d21;
      --accent: #c99b4a;
      --accent-soft: #d9b878;
      --accent-gold: #d9b878;
      --accent-error: #c99b4a;
      --accent-error-bg: #332a1a;
      --accent-error-text: #e3c589;
      --card-shadow: rgba(0, 0, 0, 0.45);
      --divider: #3a3122;
      --mermaid-bg: #241e17;
      --rule: #c99b4a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--serif-body);
      background: var(--bg-primary);
      background-image:
        radial-gradient(ellipse at top, rgba(110, 44, 44, 0.03), transparent 60%);
      color: var(--text-primary);
      padding: 40px 20px 80px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      max-width: 820px;
      margin: 0 auto 8px;
      padding-bottom: 18px;
    }

    .masthead {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .masthead-eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      font-family: var(--serif-display);
      font-size: 34px;
      font-weight: 700;
      font-style: italic;
      color: var(--text-primary);
      letter-spacing: 0.2px;
      line-height: 1.1;
    }

    .header-rule {
      max-width: 820px;
      margin: 0 auto 32px;
      height: 3px;
      background: var(--rule);
      position: relative;
    }

    .header-rule::after {
      content: "";
      position: absolute;
      left: 0;
      top: 6px;
      width: 100%;
      height: 1px;
      background: var(--border-color);
    }

    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 2px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-secondary);
      transition: all 0.3s ease;
      user-select: none;
    }

    .theme-toggle:hover {
      background: var(--bg-tertiary);
      border-color: var(--accent);
      color: var(--accent);
    }

    .theme-toggle-icon {
      font-size: 14px;
    }

    #panels-container {
      max-width: 820px;
      margin: 0 auto;
    }

    .panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 3px;
      padding: 28px 30px;
      margin-bottom: 24px;
      box-shadow: 0 3px 10px var(--card-shadow);
      transition: all 0.2s ease;
      position: relative;
    }

    .panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--accent);
      border-radius: 3px 0 0 3px;
      opacity: 0.75;
    }

    .panel:hover {
      box-shadow: 0 6px 16px var(--card-shadow);
    }

    .panel-title {
      font-family: var(--serif-display);
      font-size: 23px;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--text-primary);
      letter-spacing: 0.1px;
      line-height: 1.3;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--divider);
    }

    .panel-prose {
      font-size: 16px;
      line-height: 1.75;
      color: var(--text-secondary);
      margin-bottom: 20px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .panel-prose::first-letter {
      font-family: var(--serif-display);
      font-size: 1.6em;
      font-weight: 700;
      color: var(--accent);
    }

    .panel-diagram {
      background: var(--mermaid-bg);
      border: 1px solid var(--border-light);
      padding: 20px;
      border-radius: 2px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: auto;
    }

    .panel-diagram.mermaid {
      background: var(--mermaid-bg);
      border: 1px solid var(--divider);
    }

    .panel-diagram svg {
      max-width: 100%;
    }

    .panel-error {
      background: var(--accent-error-bg);
      border: 1px solid var(--accent-error);
      color: var(--accent-error-text);
      padding: 14px 16px;
      border-radius: 2px;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.6;
      font-family: var(--mono);
    }

    .panel-error strong {
      font-weight: 600;
    }

    .panel-error-code {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-light);
      padding: 10px;
      border-radius: 2px;
      margin-top: 10px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-tertiary);
      white-space: pre-wrap;
      word-break: break-word;
      overflow-x: auto;
    }

    .card-subtitle {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.4px;
      line-height: 1.6;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .card-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }

    .card-stat {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-light);
      border-top: 3px solid var(--tone, var(--accent));
      border-radius: 2px;
      padding: 12px 14px;
    }

    .card-stat-label {
      font-family: var(--mono);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-tertiary);
      margin-bottom: 6px;
    }

    .card-stat-value {
      font-family: var(--serif-display);
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .card-stat-detail {
      font-family: var(--serif-body);
      font-size: 12px;
      color: var(--text-tertiary);
      margin-left: 6px;
      font-weight: 500;
      font-style: italic;
    }

    .card-bar {
      height: 4px;
      border-radius: 2px;
      background: var(--border-light);
      margin-top: 9px;
      overflow: hidden;
    }

    .card-bar span {
      display: block;
      height: 100%;
      background: var(--tone, var(--accent));
    }

    .card-section {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--divider);
    }

    .card-section-heading {
      font-family: var(--serif-display);
      font-style: italic;
      font-size: 15px;
      color: var(--accent);
      margin-bottom: 10px;
      font-weight: 700;
    }

    .card-item {
      display: flex;
      gap: 10px;
      font-size: 14.5px;
      line-height: 1.65;
      color: var(--text-secondary);
      padding: 5px 0;
    }

    .card-item-marker {
      flex: none;
      width: 16px;
      text-align: center;
      color: var(--accent);
      font-family: var(--mono);
    }

    .card-item-meta {
      display: block;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.3px;
      color: var(--text-tertiary);
      margin-bottom: 2px;
    }

    .card-updated {
      margin-top: 18px;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.3px;
      color: var(--text-tertiary);
    }

    #status {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.3px;
      color: var(--text-tertiary);
      background: var(--bg-secondary);
      padding: 8px 14px;
      border: 1px solid var(--border-light);
      border-radius: 2px;
      transition: all 0.2s ease;
    }

    .empty-state {
      text-align: center;
      color: var(--text-tertiary);
      padding: 80px 20px;
      font-family: var(--serif-body);
      font-style: italic;
      font-size: 17px;
      line-height: 1.6;
    }

    /* Smooth transitions for theme changes */
    html {
      transition: background-color 0.3s ease, color 0.3s ease;
    }
  </style>
</head>
<body>
  <header>
    <div class="masthead">
      <span class="masthead-eyebrow">Analytical Canvas &middot; Vol. I</span>
      <h1>/visualize</h1>
    </div>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
      <span class="theme-toggle-icon" id="theme-icon">🌙</span>
      <span id="theme-label">Dark</span>
    </button>
  </header>
  <div class="header-rule"></div>

  <div id="panels-container">
    <div class="empty-state">Waiting for visualizations&hellip;</div>
  </div>
  <div id="status">Ready</div>

  <script>
    // ===== THEME MANAGEMENT =====
    function initTheme() {
      const saved = localStorage.getItem('visualize-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      setTheme(theme, false); // false = no animation on init
    }

    function setTheme(theme, animate = true) {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      const label = document.getElementById('theme-label');
      const isDark = theme === 'dark';

      html.setAttribute('data-theme', theme);
      localStorage.setItem('visualize-theme', theme);
      icon.textContent = isDark ? '☀️' : '🌙';
      label.textContent = isDark ? 'Light' : 'Dark';

      // Update Mermaid theme dynamically
      if (typeof mermaid !== 'undefined') {
        mermaid.initialize({
          startOnLoad: false,
          securityLevel: 'loose',
          theme: isDark ? 'dark' : 'default',
          themeVariables: getMermaidThemeVariables()
        });
      }
    }

    document.getElementById('theme-toggle').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      setTheme(next, true);
    });

    // Initialize theme on page load
    initTheme();

    // ===== PANEL MANAGEMENT =====
    let lastSeenCount = 0;
    const container = document.getElementById('panels-container');
    const statusEl = document.getElementById('status');

    async function poll() {
      try {
        const res = await fetch('/panels');
        const data = await res.json();
        const { panels } = data;

        if (panels.length > lastSeenCount) {
          // New panels arrived
          if (lastSeenCount === 0 && panels.length > 0) {
            // First time: clear empty state
            container.innerHTML = '';
          }

          // Render only new panels
          for (let i = lastSeenCount; i < panels.length; i++) {
            const panel = panels[i];
            const panelEl = document.createElement('div');
            panelEl.className = 'panel';
            if (panel.card) {
              panelEl.innerHTML = renderCard(panel.card, panel.title);
              container.appendChild(panelEl);
            } else {
              panelEl.innerHTML = `
                <div class="panel-title">${escapeHtml(panel.title || 'Untitled')}</div>
                <div class="panel-prose">${escapeHtml(panel.prose || '')}</div>
                <div id="diagram-${panel.id}" class="panel-diagram"></div>
              `;
              container.appendChild(panelEl);

              // Render diagram immediately after adding to DOM
              const diagramEl = panelEl.querySelector(`#diagram-${panel.id}`);
              if (panel.mermaid && panel.mermaid.trim()) {
                renderDiagram(diagramEl, panel.mermaid, panel.id);
              } else {
                diagramEl.innerHTML = '<span style="color: var(--text-tertiary); font-size: 13px; font-style: italic;">No diagram provided</span>';
              }
            }
          }

          lastSeenCount = panels.length;
          // Auto-scroll to newest
          window.scrollTo(0, document.body.scrollHeight);
        }

        statusEl.textContent = `Ready (${panels.length} panel${panels.length !== 1 ? 's' : ''})`;
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
      }
    }

    // Wait for Mermaid to be ready before polling
    if (typeof window.mermaid !== 'undefined') {
      console.log('[visualize] Mermaid object found:', window.mermaid);
      if (typeof window.mermaid.render === 'function') {
        console.log('[visualize] Mermaid.render is available');
      } else {
        console.error('[visualize] Mermaid.render is NOT available');
      }
    } else {
      console.error('[visualize] Mermaid failed to load from CDN');
    }

    // Poll every 1s
    setInterval(poll, 1000);
    poll(); // Initial

    const TONE_COLORS = {
      ok: '#3f7a4a',
      bad: '#a13e3e',
      warn: '#a5772d',
      info: '#3a5f8a',
      neutral: 'var(--border-color)'
    };

    const ITEM_MARKERS = { done: '✓', todo: '○', bad: '⚠', warn: '?' };

    function renderCard(card, fallbackTitle) {
      const stats = (card.stats || []).map(s => {
        const tone = TONE_COLORS[s.tone] || TONE_COLORS.neutral;
        const detail = s.detail ? `<span class="card-stat-detail">${escapeHtml(s.detail)}</span>` : '';
        const bar = typeof s.progress === 'number'
          ? `<div class="card-bar"><span style="width:${Math.max(0, Math.min(100, s.progress))}%"></span></div>`
          : '';
        return `<div class="card-stat" style="--tone:${tone}">
          <div class="card-stat-label">${escapeHtml(s.label || '')}</div>
          <div class="card-stat-value">${escapeHtml(s.value || '')}${detail}</div>
          ${bar}
        </div>`;
      }).join('');

      const sections = (card.sections || []).map(sec => {
        const items = (sec.items || []).map(it => {
          const marker = ITEM_MARKERS[it.state] || '•';
          const meta = it.meta ? `<span class="card-item-meta">${escapeHtml(it.meta)}</span>` : '';
          return `<div class="card-item">
            <span class="card-item-marker">${marker}</span>
            <span>${meta}${escapeHtml(it.text || '')}</span>
          </div>`;
        }).join('');
        return `<div class="card-section">
          <div class="card-section-heading">${escapeHtml(sec.heading || '')}</div>
          ${items}
        </div>`;
      }).join('');

      const subtitle = card.subtitle ? `<div class="card-subtitle">${escapeHtml(card.subtitle)}</div>` : '';
      const updated = card.updated ? `<div class="card-updated">Updated ${escapeHtml(card.updated)}</div>` : '';
      const error = card.error ? `<div class="panel-error"><strong>Error:</strong> ${escapeHtml(card.error)}</div>` : '';

      return `<div class="panel-title">${escapeHtml(card.title || fallbackTitle || 'Untitled')}</div>
        ${subtitle}${error}
        <div class="card-stats">${stats}</div>
        ${sections}${updated}`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function renderDiagram(container, mermaidCode, panelId) {
      try {
        // IMPORTANT: use a throwaway id DIFFERENT from our container's own id.
        // mermaid.render() creates a temporary hidden element with this id
        // internally, renders into it, then REMOVES it as cleanup. If we reuse
        // our real container's id here, mermaid hijacks/deletes our element.
        const renderId = `mermaid-render-${panelId}`;

        // Use mermaid.render() to convert code -> SVG string
        const { svg } = await mermaid.render(renderId, mermaidCode);

        // Insert the SVG into OUR OWN container (untouched by mermaid)
        container.innerHTML = svg;
        container.classList.add('mermaid');
        // Let CSS variables handle the background
        container.style.background = '';

        console.log(`[visualize] Rendered diagram ${panelId} successfully`);
      } catch (err) {
        // Render error message + raw code
        console.error(`[visualize] Diagram ${panelId} failed:`, err);
        const errorHtml = `
          <div class="panel-error">
            <strong>Diagram Error:</strong> ${escapeHtml(err.message || String(err))}
            <div class="panel-error-code">${escapeHtml(mermaidCode)}</div>
          </div>
        `;
        container.innerHTML = errorHtml;
        container.classList.remove('mermaid');
      }
    }
  </script>
</body>
</html>
